services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      RAG_STRATEGY: recursive
      # Ollama runs on the host, not in this compose stack -- reuse the
      # model you already have pulled locally instead of re-downloading it
      # into a container. Override if you'd rather run Ollama in compose too.
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
