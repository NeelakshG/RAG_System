[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f9f9f7"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
# MB. Matches the API's RAG_MAX_UPLOAD_MB default so oversized files are
# rejected in the browser before they're ever sent.
maxUploadSize = 10
